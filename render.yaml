# Separate Render services for the public synthetic-data demo.
# Set VITE_API_BASE_URL and CORS_ORIGINS to the actual HTTPS service URLs when creating the Blueprint.
services:
  - type: web
    name: paylens-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    initialDeployHook: python bootstrap.py --seed --output /tmp/paylens-starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paylens-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_MODE
        value: "true"

  - type: web
    name: paylens-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: paylens-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: comp_review
    user: comp_review
    ipAllowList: []
